name: cost-calculation
services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  postgres:
    image: postgres:17.6
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: cost_calculation
      POSTGRES_USER: cost
      POSTGRES_PASSWORD: cost_local_only
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cost -d cost_calculation"]
      interval: 5s
      timeout: 5s
      retries: 10
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/create-topics.sh:/scripts/create-topics.sh:ro
  orchestrator-api:
    profiles: [apps]
    build:
      context: .
      args:
        MODULE: orchestrator-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/cost_calculation
      COMMAND_URL: http://command-service:8081
      QUERY_URL: http://query-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  command-service:
    profiles: [apps]
    build:
      context: .
      args:
        MODULE: command-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/cost_calculation
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  query-service:
    profiles: [apps]
    build:
      context: .
      args:
        MODULE: query-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/cost_calculation
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  first-cost-service:
    profiles: [apps]
    build:
      context: .
      args:
        MODULE: first-cost-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/cost_calculation
      DEMO_FAILURES: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  freight-cost-service:
    profiles: [apps]
    build:
      context: .
      args:
        MODULE: freight-cost-service
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/cost_calculation
      DEMO_FAILURES: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  handling-cost-service:
    profiles: [apps]
    build:
      context: .
      args:
        MODULE: handling-cost-service
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/cost_calculation
      DEMO_FAILURES: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  inventory-cost-service:
    profiles: [apps]
    build:
      context: .
      args:
        MODULE: inventory-cost-service
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/cost_calculation
      DEMO_FAILURES: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  calculation-aggregator:
    profiles: [apps]
    build:
      context: .
      args:
        MODULE: calculation-aggregator
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/cost_calculation
      KAFKA_STREAMS_STATE_DIR: /tmp/kafka-streams
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  data-sink-service:
    profiles: [apps]
    build:
      context: .
      args:
        MODULE: data-sink-service
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/cost_calculation
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
volumes:
  kafka-data:
  postgres-data:
