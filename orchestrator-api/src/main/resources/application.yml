server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
spring:
  application:
    name: orchestrator-api
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
services:
  command-url: ${COMMAND_URL:http://localhost:8081}
  query-url: ${QUERY_URL:http://localhost:8082}
